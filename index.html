<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Meridian · Workforce Capability View</title>
<style>
:root{--bg:#EEF1F4;--pn:#fff;--ink:#14212E;--mu:#526170;--ln:#D3DAE1;--tl:#0B6B5C;--ht:#C2410C;--am:#8A5A0B;--amb:#F6E8CC;--hd:Palatino,"Palatino Linotype","Book Antiqua",Georgia,serif;--bd:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--bd);display:grid;grid-template-columns:248px 1fr;min-height:100vh}
nav{background:var(--ink);color:#E6ECF1;padding:28px 18px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
nav b{font:600 20px var(--hd);padding:0 10px 4px}nav small{color:#A9B7C4;padding:0 10px 18px;font-size:13px}
nav button{all:unset;cursor:pointer;padding:10px;border-radius:8px;color:#C9D4DE;font-size:15px}
nav button[aria-current=step]{background:#24384C;color:#fff}nav button:hover{background:#1D2F42}
nav .tag{margin-top:auto;font-size:12px;color:#A9B7C4;padding:10px}
button:focus-visible,input:focus-visible{outline:3px solid #2F7FD1;outline-offset:2px}
main{padding:36px 48px;max-width:1120px}
h1{font:600 32px/1.2 var(--hd);margin:0 0 6px}.sub{color:var(--mu);margin:0 0 24px;max-width:70ch}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:22px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.mt{margin-top:16px}
.why{all:unset;cursor:pointer;border-bottom:1.5px dotted var(--mu);font-weight:600}.why:hover{color:var(--tl)}
.cta{all:unset;cursor:pointer;background:var(--tl);color:#fff;padding:11px 18px;border-radius:8px;font-weight:600}.cta:hover{background:#085346}
.ghost{all:unset;cursor:pointer;border:1px solid var(--ink);padding:9px 14px;border-radius:8px;font-weight:600}.ghost:hover{background:#fff}
.row{display:grid;grid-template-columns:230px 1fr 130px;gap:14px;align-items:center;padding:7px 0}
.bar{height:26px;background:#DDE3E9;border-radius:6px;overflow:hidden;display:flex}.bar i{display:block;height:100%}
.hatch{background:repeating-linear-gradient(45deg,#E4E8EC 0 6px,#CBD2D9 6px 8px)}
.big{font:600 40px/1.1 var(--hd)}.mu{color:var(--mu)}.sm{font-size:14px}
.ev{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600}
.ev:before{content:"";width:12px;height:12px;border-radius:2px;border:2px solid var(--tl)}
.ev.V:before{background:var(--tl)}.ev.O:before{background:linear-gradient(90deg,var(--tl) 50%,#fff 50%)}
.ev.I:before{border-color:var(--am)}.ev.U:before{border:2px dashed #6B7886}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:14px;color:var(--mu);border-bottom:2px solid var(--ink);padding:8px 6px}td{padding:10px 6px;border-bottom:1px solid var(--ln)}
.pl{all:unset;cursor:pointer;display:block;width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:8px;background:#fff;margin-bottom:8px}.pl[aria-pressed=true]{border:2px solid var(--tl);padding:10px 11px}
.note{background:var(--amb);border:1px solid #E5C79B;border-radius:10px;padding:14px 16px}
label{display:block;font-weight:600;margin-top:14px}input[type=range]{width:100%;accent-color:var(--tl)}
#dr{position:fixed;right:0;top:0;height:100vh;width:380px;background:#fff;border-left:1px solid var(--ln);box-shadow:-8px 0 24px rgba(20,33,46,.12);padding:26px;transform:translateX(105%);transition:transform .18s;overflow:auto}
#dr.o{transform:none}#dr h2{font:600 22px var(--hd);margin:0 0 10px}#dr dt{font-weight:600;margin-top:12px;font-size:14px;color:var(--mu)}#dr dd{margin:2px 0 0}
@media(max-width:900px){body{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap}nav .tag,nav small{display:none}main{padding:24px}.g2,.g3{grid-template-columns:1fr}.row{grid-template-columns:1fr}#dr{width:100%}}
@media(prefers-reduced-motion:reduce){#dr{transition:none}}
nav .rs{display:flex;gap:6px;padding:0 10px 14px}nav .rs button{padding:6px 10px;border:1px solid #5B6F83;border-radius:6px;font-size:13px}nav .rs button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:600}.tg{all:unset;cursor:pointer;border:1px solid var(--tl);color:var(--tl);padding:5px 10px;border-radius:6px;font-weight:600;font-size:14px}.tg[aria-pressed=true]{background:var(--tl);color:#fff}.tg:focus-visible{outline:3px solid #2F7FD1;outline-offset:2px}</style></head><body>
<nav aria-label="Journey"><b>Meridian</b><small>Workforce capability view</small><div class="rs" id="rs"></div><div id="st" style="display:contents"></div><div class="tag">All people and counts here are illustrative or assumed. Open any figure for its basis.</div></nav>
<main id="m" tabindex="-1"></main>
<aside id="dr" aria-label="Basis of this figure"></aside>
<script>
const $=s=>document.querySelector(s);
const MENU=[["The question","Where exposure sits","Metering workforce","One person","Decision"],["Today's work","Assessment queue","Demand check","One person","Governance and audit"]];
let role=0,s=0,strict=false,pi=0,E={rate:60,R:20,C:120,r:50,aud:8},sched={},fund=[0,0,0,0,0],done=[0,0,0,0,0];
const F=[["Field metering",6000,70],["Customer service and billing",5000,50],["Back-office administration",4500,45],["Plant operations",14000,15],["Transmission and distribution",9000,20],["Procurement and logistics",3000,30],["Engineering and planning",5000,15],["Corporate and management",5500,10]];
const GR=[["Stays in transformed metering work",1800,.4,"#4A6278"],["Redeploy to adjacent bands",2520,.35,"#0B6B5C"],["Other routes, no forced exit",1680,.25,"#B9852E"]];
const BD=[["Smart-meter installation and service",1200],["Field IoT and network operations",500],["Meter data and exception analysis",400],["Distribution maintenance",600],["Customer connections and service",300]];
const RT=[["Insource contractor work",500],["Natural attrition",600],["Voluntary early retirement",400],["Extended reskilling",180]];
const GV=["Day 5: principles brief to the union","Day 10: joint working group, aggregate data only","Day 15: Ministry briefed on the no-layoff design","Day 45: evidence and pilot results to the Ministry","Day 80: Board pre-read"];
const PR=[["Low",40,25,120,50],["Base",60,20,120,50],["High",75,15,120,50],["All four low",40,25,100,25]];
const L={V:"Verified",O:"Observed",I:"Inferred",U:"Unknown"};
const SK=["Electrical safety","Meter installation","Handheld and IoT configuration","Customer premises protocol"];
const P=[["A-0412",4,"Region 3",[[4,"V","Certification record, 2024"],[4,"V","Assessment, 2023"],[2,"I","Course titles only"],[3,"O","Supervisor note, 2025"]]],
["B-0733",4,"Region 5",[[4,"V","Certification record, 2024"],[4,"V","Assessment, 2024"],[3,"V","Vendor course assessment, 2025"],[3,"O","Supervisor note, 2025"]]],
["A-1187",3,"Region 1",[[3,"O","Supervisor note, 2025"],[3,"O","Supervisor note, 2025"],[2,"V","Assessment, 2025"],[3,"O","Supervisor note, 2025"]]],
["C-2250",2,"Region 2",[[2,"I","Job title only"],[2,"I","Course titles only"],[0,"U","No record"],[0,"U","No record"]]]];
const W={d4200:["~4,200 role-equivalents of work","Derived from case facts","6,000 people x ~70% automatable within 18 months","Medium","This is work, not headcount. Redeployment depends on funded demand."],
ill:["Base-case planning split","Planning scenario (assumption)","6,000 = 1,800 who stay (6,000 minus 4,200) + 2,520 redeployed (60% of 4,200) + 1,680 on other routes","Low","This is not a classification of individuals. Placement is confirmed only against funded roles."],
act:["People you can act on today","Computed on this screen","Sum of each group size x its illustrative share with verified or observed evidence (35 to 40%, below the 55% of records with any skill data)","Low. Shares are assumptions","Inferred and unknown evidence never supports a placement or surplus decision. It only triggers an assessment."],
econ:["Scenario result","Computed from the sliders","Net = placed x (loaded cost x realized share - reskilling) - Rp 3,500M fee. Placed = 4,200 x placement rate.","Low. Every input is an assumption","Benefit counts only where Finance confirms a cashable budget line. Payroll is off-limits, so loaded cost needs HR grade-band ranges."],
cap:["Capacity at risk, year 1: Rp 168B","Derived assumption","1,400 average idle FTE (half of 2,800 at month 12) x Rp 120M","Low","Capacity, not cash. Only budget lines that actually shrink are cashable."]};
F.forEach((f,i)=>W["f"+i]=[f[0],i?"Assumption from sector patterns":"Day-30 analysis (case finding)",i?"Replace with measured task data by Day 60":"Task analysis and procurement plan for smart meters, IoT and AI operations",i?"Low":"Medium",i?"Not measured yet.":"Confirm the task-level basis before the Board sees it."]);
const n=x=>Math.round(x).toLocaleString("en-US"),OK=()=>GR.reduce((a,g)=>a+g[1]*g[2],0),pl=d=>Math.round(d*.84);
const why=(k,t)=>`<button class="why" data-k="${k}">${t}</button>`;
function dec(sk){const u=sk.some(x=>x[1]=="U"),i=sk.some(x=>x[1]=="I"),all=sk.every(x=>x[0]>=3);return u?["No basis for a decision","At least one required skill has no defensible evidence. Record the gap; HR can schedule an assessment.",1]:i?["Invite to assessment only","Some skills rest on inferred evidence. Placement and surplus conclusions are not allowed.",1]:all?["Eligible for placement review","Evidence supports the match. A named person approves, and funded demand must exist.",0]:["Offer training","The gap is evidenced. Offer a learning path before any match.",0]}
function rail(){$("#rs").innerHTML=["Director","HR manager"].map((t,i)=>`<button data-ro="${i}" aria-pressed="${i==role}">${t}</button>`).join("");$("#st").innerHTML=MENU[role].map((t,i)=>`<button data-s="${i}" ${i==s?'aria-current="step"':''}>${i+1}. ${t}</button>`).join("")}
function S0(){return`<h1>Which of our people will AI displace, and what do we do with them?</h1><p class="sub">You asked for a way to run the workforce differently on top of what you already have. Three limits shape everything here.</p>
<div class="g3"><div class="card"><b>No layoffs</b><p class="mu">The plan only describes redeployment. No screen produces a surplus list.</p></div><div class="card"><b>No system replacement</b><p class="mu">Reads from SAP SuccessFactors, Moodle and regional tools as they are.</p></div><div class="card"><b>No payroll data</b><p class="mu">Everything works without compensation data. Costs are labelled assumptions.</p></div></div>
<div class="card mt"><b>What Day 30 found</b><p class="big">${why("d4200","~4,200")} <span style="font-size:22px">role-equivalents of metering work</span></p><p class="mu">Field Metering and Manual Operations: about 6,000 people, about 70% automatable within 18 months.</p><button class="cta" data-s="1">See where exposure sits</button></div>`}
function S1(){const mx=4200;return`<h1>Metering is the highest rate; volume tells a second story</h1><p class="sub">Work displaced in full-time equivalents, by job family, out of 52,000 people. Only metering comes from Day-30 analysis.</p><div class="card">`+F.map((f,i)=>{const d=f[1]*f[2]/100;return`<div class="row"><span>${why("f"+i,f[0])}</span><div class="bar"><i style="width:${d/mx*100}%;background:${f[2]>=45?'var(--ht)':'#4A6278'}"></i></div><span class="sm">${n(d)} FTE · ${f[2]}%${i?' (A)':''}</span></div>`}).join("")+`</div><div class="note mt">Three high-rate families hold about 59% of the 14,825 displaced FTE. Rates marked (A) are assumptions until measured.</div><p><button class="cta" data-s="2">Open Field Metering</button></p>`}
function S2(){const tot=6000,ok=OK(),pc=Math.round(ok/tot*100);
const bar=GR.map(g=>strict?`<i style="width:${g[1]/tot*g[2]*100}%;background:${g[3]}"></i><i class="hatch" style="width:${g[1]/tot*(1-g[2])*100}%"></i>`:`<i style="width:${g[1]/tot*100}%;background:${g[3]}"></i>`).join("");
const tb=(a,f)=>`<table>${a.map(x=>`<tr><td>${x[0]}</td><td>${n(f?pl(x[1]):x[1])}</td></tr>`).join("")}</table>`;
return`<h1>${strict?`Only ${pc}% have evidence to be assigned to a route today`:'Where the 6,000 people go in the base case'}</h1><p class="sub">${why("ill","Base-case planning split")} (assumption). Toggle the evidence filter to see what the data supports.</p>
<div class="card"><div class="bar" style="height:54px">${bar}</div><div class="g3 mt">${GR.map(g=>`<div><b style="color:${g[3]}">${g[0]}</b><br>${n(g[1])}<br><span class="sm mu">${Math.round(g[2]*100)}% verified or observed (A)</span></div>`).join("")}</div>
<p class="mt"><button class="ghost" data-t="1" aria-pressed="${strict}">${strict?'Show everyone':'Count only verified and observed evidence'}</button></p></div>
<div class="note mt">${strict?`${why("act",n(ok)+" of 6,000 people")} have verified or observed evidence for the skills their route needs. The hatched part needs an assessment first. Nobody is classified as surplus from this screen.`:'This view counts every person at the base-case planning split, including those whose skills are only inferred or unknown.'}</div>
<div class="g2 mt"><div class="card"><b>Redeploy to adjacent bands</b><p class="sm mu">Band, people placed (84% of demand, A)</p>${tb(BD,1)}</div><div class="card"><b>Other routes, no forced exit</b><p class="sm mu">Route, people (A)</p>${tb(RT,0)}</div></div><p><button class="cta" data-s="3">Open a person record</button></p>`}
function S3(){const p=P[pi],sk=p[3],d=dec(sk),b=fund[0];
return`<h1>One person, one path, and what you may decide</h1><p class="sub">Target band: smart-meter installation and service (needs level 3 or more in each skill). Band demand is 1,200 (A) and funded roles are ${b?'confirmed':'not yet confirmed'}.</p><div class="g2" style="grid-template-columns:230px 1fr"><div>${P.map((q,i)=>`<button class="pl" data-p="${i}" aria-pressed="${i==pi}"><b>${q[0]}</b><br><span class="sm mu">Grade ${q[1]} of 8 · ${q[2]}</span></button>`).join("")}</div>
<div class="card"><table><tr><th>Skill</th><th>Level</th><th>Evidence</th><th>Source</th></tr>${SK.map((k,i)=>`<tr><td>${k}</td><td>${sk[i][0]?sk[i][0]+' of 5':'Unknown'}</td><td><span class="ev ${sk[i][1]}">${L[sk[i][1]]}</span></td><td class="sm mu">${sk[i][2]}</td></tr>`).join("")}</table>
<div class="note mt"><b>${d[0]}</b><br>${d[1]}</div><p class="sm mu">Performance data from before 2023 is excluded. Confidence is ${d[2]?'low':'medium'}.</p></div></div><p><button class="cta" data-s="4">${role?'Open governance and audit':'See the Board view'}</button></p>`}
function S4(){const sl=(id,l,mn,mx,st,u)=>`<label for="${id}">${l}: <output id="o_${id}">${E[id]}</output>${u} <span class="sm mu">(assumption)</span></label><input type="range" id="${id}" min="${mn}" max="${mx}" step="${st}" value="${E[id]}">`;
return`<h1>Does redeployment pay back the Rp 3.5B?</h1><p class="sub">Move the assumptions. Nothing here is a forecast; benefit counts only where Finance confirms a cashable budget line. ${why("cap","Capacity at risk is Rp 168B in year 1")}, which is capacity, not cash.</p><p>${PR.map((q,i)=>`<button class="ghost" data-e="${i}">${q[0]}</button> `).join("")}</p><div class="g2"><div class="card">${sl("rate","Placement rate",40,75,5,"%")}${sl("R","Reskilling cost per person",15,25,1," Rp M")}${sl("C","Loaded cost per field employee",100,140,5," Rp M per year")}${sl("r","Benefit that is cashable and realized in year 1",25,75,5,"%")}</div>
<div class="card" id="out"></div></div><div class="note mt"><b>Gates.</b> Day 30: go if data access and task validation are viable. Day 60: go if funded demand exists. Day 90: scale, revise or stop. <b>Recommendation:</b> approve the Field Metering lighthouse; withhold enterprise rollout and any ROI commitment until the gates pass.</div>`}
function out(){const P4=4200*E.rate/100,k=E.C*E.r/100-E.R,net=P4*k-3500,cost=P4*E.R+3500,be=k>0?3500/k:Infinity;
$("#out").innerHTML=`<span class="mu">Net value, year 1</span><p class="big">${why("econ","Rp "+(net/1000).toFixed(1)+"B")}</p><p>Program return: <b>${Math.round(net/cost*100)}%</b> on Rp ${(cost/1000).toFixed(1)}B total cost</p><p>People placed: <b>${n(P4)}</b></p><p>Break-even: <b>${isFinite(be)?n(be)+' people':'not reachable'}</b></p><p class="sm mu">Layoff then rehire for the same people (not permitted, A): Rp ${(P4*180/1000).toFixed(1)}B vs Rp ${(P4*E.R/1000).toFixed(1)}B for reskilling.</p>${k<=0?'<div class="note">At these inputs, each placement returns nothing in year 1 beyond its reskilling cost.</div>':''}`}
function H0(){const ok=OK(),f=fund.reduce((a,x,i)=>a+x*pl(BD[i][1]),0),g=done.reduce((a,x)=>a+x,0);
return`<h1>Today's work: what must be true before anyone moves</h1><p class="sub">Three checks sit between the Director's decision and a real placement.</p><div class="g3"><div class="card"><p class="big">${n(6000-ok)}</p><p>people lack verified or observed evidence for a required skill (illustrative, ${why("act","basis")}).</p><button class="ghost" data-s="1">Open the assessment queue</button></div><div class="card"><p class="big">${n(f)}</p><p>of 2,520 placements are backed by funded roles.</p><button class="ghost" data-s="2">Open the demand check</button></div><div class="card"><p class="big">${g} of 5</p><p>union and Ministry steps completed.</p><button class="ghost" data-s="4">Open governance and audit</button></div></div>`}
function H1(){return`<h1>Who needs an assessment first</h1><p class="sub">About ${n(6000-OK())} of 6,000 people have weak or missing evidence in the illustrative base. Four sample records follow.</p><div class="card"><table><tr><th>Record</th><th>Decision allowed</th><th>Action</th></tr>${P.map(p=>{const d=dec(p[3]);return`<tr><td><b>${p[0]}</b><br><span class="sm mu">Grade ${p[1]} of 8 · ${p[2]}</span></td><td>${d[0]}</td><td>${d[2]?`<button class="tg" data-sc="${p[0]}" aria-pressed="${!!sched[p[0]]}">${sched[p[0]]?'Assessment scheduled':'Schedule assessment'}</button>`:'<span class="sm mu">Named human review</span>'}</td></tr>`}).join("")}</table></div><div class="note mt">Scheduling is a request. A named human owns every outcome, and the person can see and correct their record.</div><p><button class="cta" data-s="3">Open a person record</button></p>`}
function H2(){const f=fund.reduce((a,x,i)=>a+x*pl(BD[i][1]),0);return`<h1>Demand check: placements only up to funded roles</h1><p class="sub">Operations confirms funded roles by band. Demand figures are assumptions until then.</p><div class="card"><table><tr><th>Band</th><th>Demand (A)</th><th>Placeable (84%)</th><th>Status</th></tr>${BD.map((b,i)=>`<tr><td>${b[0]}</td><td>${n(b[1])}</td><td>${n(pl(b[1]))}</td><td><button class="tg" data-f="${i}" aria-pressed="${!!fund[i]}">${fund[i]?'Funded, confirmed':'Confirm funded'}</button></td></tr>`).join("")}</table></div><div class="note mt"><b>${n(f)} of 2,520</b> placements are allowed to proceed. The rest wait for funded roles; no training or offer is committed without them.</div>`}
function H4(){const a=E.aud;return`<h1>Governance and audit</h1><p class="sub">Who is brought in, when, and what stops a wave.</p><div class="g2"><div class="card"><b>Union and Ministry steps</b><table>${GV.map((t,i)=>`<tr><td>${t}</td><td><button class="tg" data-d="${i}" aria-pressed="${!!done[i]}">${done[i]?'Done':'Mark done'}</button></td></tr>`).join("")}</table></div><div class="card"><b>Audit sample</b><p class="sm mu">5% of records are checked against assessments each wave (A). A wave pauses above 15% disagreement (A).</p><label for="aud">Disagreement found: <output id="o_aud">${a}</output>%</label><input type="range" id="aud" min="0" max="30" step="1" value="${a}"><div id="au" class="note mt"></div></div></div><p><button class="cta" data-s="0">Back to today's work</button></p>`}
function au(){const a=E.aud;$("#au").innerHTML=a>15?'<b>Pause the wave.</b> Disagreement is above the threshold. Review the evidence rules before more records are used.':'<b>Within threshold.</b> The wave can continue.'}
function R(){$("#m").innerHTML=(role?[H0,H1,H2,S3,H4]:[S0,S1,S2,S3,S4])[s]();rail();if(!role&&s==4)out();if(role&&s==4)au()}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
if(d.ro!=null){role=+d.ro;s=0;R()}
else if(d.s!=null){s=+d.s;R();scrollTo(0,0);$("#m").focus()}
else if(d.t){strict=!strict;R()}
else if(d.p!=null){pi=+d.p;R()}
else if(d.e!=null){const q=PR[+d.e];E.rate=q[1];E.R=q[2];E.C=q[3];E.r=q[4];R()}
else if(d.sc){sched[d.sc]=!sched[d.sc];R()}
else if(d.f!=null){fund[+d.f]^=1;R()}
else if(d.d!=null){done[+d.d]^=1;R()}
else if(d.k){const w=W[d.k];$("#dr").innerHTML=`<button class="ghost" id="x">Close</button><h2 style="margin-top:16px">${w[0]}</h2><dl><dt>Type</dt><dd>${w[1]}</dd><dt>Based on</dt><dd>${w[2]}</dd><dt>Confidence</dt><dd>${w[3]}</dd><dt>What to challenge</dt><dd>${w[4]}</dd></dl>`;$("#dr").classList.add("o");$("#x").focus()}
else if(b.id=="x")$("#dr").classList.remove("o")});
document.addEventListener("input",e=>{if(e.target.type=="range"){E[e.target.id]=+e.target.value;$("#o_"+e.target.id).textContent=e.target.value;e.target.id=="aud"?au():out()}});
document.addEventListener("keydown",e=>{if(e.key=="Escape")$("#dr").classList.remove("o")});
R();
</script></body></html>
